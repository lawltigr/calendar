{% extends "base.html" %}
{%block title %}Calendar{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h3>Class Calendar</h3>
    <a href="{{ url_for('main.course_new') }}" class="btn btn-success">+ New Course</a>
</div>
<div class="mb-3 small">
    <span class="badge" style="background: #0d6efd;">&nbsp;</span>Available
    <span class="badge" style="background: #198754;">&nbsp;</span>You booked
    <span class="badge" style="background: #6c757d;">&nbsp;</span>No spots
    <span class="badge" style="background: #adb5bd;">&nbsp;</span>Ended
</div>
<div id="calendar" class="bg-white p-2 rounded shadow-sm"></div>
{% endblock %}

{% block scripts %}
<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const calendarEl = document.getElementById('calendar');
        const calendar = new FullCalendar.Calendar(calendarEl, {
            initialView: 'dayGridMonth',
            locale: 'ru',
            firstDay: 1,
            headerToolbar: {
                left: 'prev,next today',
                center: 'title',
                right: 'dayGridMonth, timeGridWeek, listWeek'
            },
            height: 'auto',
            events: "{{ url_for('main.api_sessions')}}",
        });
        calendar.render();
    })
</script>
{% endblock %}
